name: Deploy Server (Go)

on:
  push:
    branches:
      - server
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Go binary
        run: |
          cd server
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/blog-server .
          chmod +x dist/blog-server

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "server/dist/"
          target: "/var/muxiao-server/blogs-new"
          strip_components: 2

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/muxiao-server
            
            # 备份
            if [ -d "blogs" ]; then
              BACKUP_NAME="blogs.backup.$(date +%Y%m%d_%H%M%S)"
              mv blogs "$BACKUP_NAME"
              echo "✅ Backed up: $BACKUP_NAME"
            fi
            
            # 部署新版本
            if [ -d "blogs-new" ]; then
              mv blogs-new blogs
              echo "✅ Deployed"
            else
              echo "❌ blogs-new not found"
              exit 1
            fi
            
            # 重启服务
            sudo systemctl restart lumina-blog
            sleep 2
            
            if systemctl is-active --quiet lumina-blog; then
              echo "✅ Service running"
            else
              echo "❌ Service failed"
              systemctl status lumina-blog --no-pager
              exit 1
            fi