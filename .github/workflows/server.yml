name: Deploy Server (Go)

on:
  push:
    branches:
      - server-publish
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: |
          cd server
          go mod download

      - name: Build
        run: |
          cd server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o server main.go

      - name: Create upload directory
        run: |
          cd server
          mkdir -p public/uploads

      - name: Package
        run: |
          cd server
          tar -czvf server.tar.gz server public

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "server/server.tar.gz"
          target: "/data/blogs-server"
          strip_components: 0

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /data/blogs-server
            tar -xzvf server.tar.gz
            rm server.tar.gz
            # 确保上传目录存在
            mkdir -p public/uploads
            # 停止旧进程
            pm2 stop blog-server 2>/dev/null || true
            # 启动新服务
            pm2 start server --name "blog-server" || pm2 restart blog-server
